<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkinDecide Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0ece2; --surface:#faf8f4; --surface-2:#f4f0e8; --line:#ddd8ce;
  --ink:#1a1612; --muted:#6b6358; --accent:#c8432a; --accent-soft:#f6ddd5;
  --good:#5e8a5a; --good-soft:#e3eddc; --warn:#c08a2e; --bad:#c8432a; --bad-soft:#f6ddd5;
  --track:#e8e3d8; --shadow:0 1px 2px rgba(26,22,18,.04);
}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1d1a17; --surface-2:#24201c; --line:#35302a;
  --ink:#f2ece2; --muted:#a39a8d; --accent:#e8846e; --accent-soft:#3a231c;
  --good:#8fbf87; --good-soft:#1f2b1d; --warn:#e0b35e; --bad:#e8846e; --bad-soft:#3a231c;
  --track:#2e2924; --shadow:none;
}
:root[data-theme="sage"]{
  --bg:#e9ede4; --surface:#f7f9f4; --surface-2:#eef2ea; --line:#d3dacb;
  --ink:#1b211a; --muted:#5d6858; --accent:#4f7a55; --accent-soft:#dbe8d8;
  --good:#4f7a55; --good-soft:#dbe8d8; --warn:#b5852b; --bad:#b9533b; --bad-soft:#f3ddd4;
  --track:#dfe5d8;
}
:root[data-theme="blush"]{
  --bg:#f6ebe8; --surface:#fdf8f6; --surface-2:#f9efec; --line:#ead7d1;
  --ink:#2a1a1a; --muted:#7a6260; --accent:#b8506a; --accent-soft:#f5dce2;
  --good:#5e8a5a; --good-soft:#e3eddc; --warn:#c08a2e; --bad:#b8506a; --bad-soft:#f5dce2;
  --track:#f0e2de;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 80px}
.mono{font-family:'DM Mono',monospace}
.label{font-family:'DM Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
h1,h2,h3{font-family:'DM Serif Display',serif;font-weight:400;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.1}
h2{font-size:22px}
h3{font-size:17px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:14px 24px 0;display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:'DM Serif Display',serif;font-size:20px}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.tab .live{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* layout */
.page{display:none;padding-top:28px}
.page.active{display:block}
.head{margin-bottom:22px}
.head .label{margin-bottom:6px}
.head p{color:var(--muted);max-width:720px;margin-top:6px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:1.6fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mt{margin-top:14px}
.kpi .v{font-family:'DM Serif Display',serif;font-size:32px;line-height:1.1;margin-top:6px}
.kpi .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi .s b{color:var(--ink);font-weight:500}
.pill{display:inline-flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;border-radius:5px;padding:2px 6px;min-width:24px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.ig{color:#b8506a}.pill.tt{color:var(--ink)}.pill.yt{color:#c8432a}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);margin:2px 4px 2px 0}
.empty{color:var(--muted);font-size:13px;padding:14px 0}
.muted{color:var(--muted)}
.up{color:var(--good)}.down{color:var(--bad)}

/* bars */
.brow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(60px,1.1fr) 62px;align-items:center;gap:10px;padding:7px 0;font-size:13.5px}
.brow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .n{text-align:right;font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar i.good{background:var(--good)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.srow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 34px;align-items:center;gap:12px;padding:6px 0;font-size:13.5px}
.srow .n{text-align:right;font-family:'DM Mono',monospace;font-size:12px}
.srow .sub{display:block;font-size:11.5px;color:var(--muted)}

/* table */
.tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:400;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th.num,td.num{text-align:right}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{font-family:'DM Mono',monospace;font-size:12px}
tr:last-child td{border-bottom:none}
td .title{font-weight:500}
td .meta{font-size:11.5px;color:var(--muted)}
th.sorted{color:var(--ink)}

/* insight cards */
.insight{border-radius:10px;padding:13px 15px;margin-bottom:10px;border:1px solid var(--line)}
.insight.good{background:var(--good-soft);border-color:transparent}
.insight.bad{background:var(--bad-soft);border-color:transparent}
.insight b{display:block;font-weight:600;margin-bottom:3px}
.insight p{font-size:13px;color:var(--ink);opacity:.85}

/* trending */
.topic{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--surface)}
.topic-h{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.rank{flex:none;width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;font-family:'DM Mono',monospace;font-size:12px;display:flex;align-items:center;justify-content:center}
.topic h3{font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:600;flex:1}
.topic p{font-size:13px;color:var(--muted);margin:6px 0 4px}
.hook{border-left:3px solid var(--good);background:var(--good-soft);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:10px}
.hook.alt{border-left-color:var(--warn);background:var(--surface-2)}
.hook .q{font-family:'DM Serif Display',serif;font-style:italic;font-size:16px;margin:4px 0}
.hook p{font-size:12.5px;color:var(--muted)}
.idea{display:grid;grid-template-columns:52px 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--surface)}
.idea .num{background:var(--accent);color:#fff;font-family:'DM Serif Display',serif;font-size:24px;display:flex;align-items:center;justify-content:center}
.idea:nth-child(3n+2) .num{background:var(--good)}
.idea:nth-child(3n) .num{background:var(--warn)}
.idea .body{padding:14px 16px}
.idea .hk{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;margin:8px 0}
.idea .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12.5px}
.idea .cols .label{margin-bottom:2px}

/* content bank + planner */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.item .it{font-weight:500;margin-bottom:4px}
.item .ia{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:180px;display:flex;flex-direction:column}
.day.post{border-color:var(--accent)}
.day h3{font-size:16px;margin-bottom:2px}
.day .items{flex:1;margin:10px 0}
.pitem{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;padding:7px 8px;background:var(--surface-2);border-radius:8px;margin-bottom:6px}
.pitem.done .ptxt{text-decoration:line-through;color:var(--muted)}
.pitem input{margin-top:3px;accent-color:var(--accent)}
.pitem .ptxt{flex:1;min-width:0;word-wrap:break-word}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.x:hover{color:var(--bad)}

/* change */
.delta{font-family:'DM Mono',monospace;font-size:12px;margin-left:6px}

/* modal */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(20,16,12,.45)}
.mh{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center}
.mb{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mb .full{grid-column:1/-1}
.mb label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.mb input,.mb select,.mb textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink);width:100%}
.mb textarea{min-height:80px;resize:vertical;font-family:'DM Mono',monospace;font-size:12px}
.mf{padding:0 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:84px;border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:none;font-size:11.5px;text-align:center}
.sw.on{border-color:var(--accent)}
.sw span{display:block;height:34px;border-radius:6px;margin-bottom:5px}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3,.g-main{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kanban{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .wrap,.topbar-in{padding-left:16px;padding-right:16px}
  .g4,.g2,.kanban,.week{grid-template-columns:1fr}
  h1{font-size:28px}
  .brandrow{flex-direction:column;align-items:flex-start}
  .mb{grid-template-columns:1fr}
  .idea .cols{grid-template-columns:1fr}
  .tablewrap{margin:0 -20px}
  .brow{grid-template-columns:28px minmax(0,1fr) 54px;}
  .brow .bar{grid-column:2/4;grid-row:2}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brandrow">
      <div class="logo"><span class="logo-dot"></span>SkinDecide <span class="label" style="margin-left:4px">Command Center</span></div>
      <div class="actions">
        <button class="btn" data-act="add-post">+ Post toevoegen</button>
        <button class="btn" data-act="data">Data</button>
        <button class="btn" data-act="settings">Thema &amp; instellingen</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">Overzicht</button>
      <button class="tab" data-tab="ig">Instagram</button>
      <button class="tab" data-tab="tt">TikTok</button>
      <button class="tab" data-tab="yt">YouTube</button>
      <button class="tab" data-tab="trend"><span class="live"></span>Trending nu</button>
      <button class="tab" data-tab="bank">Contentbank</button>
      <button class="tab" data-tab="plan">Weekplanner</button>
      <button class="tab" data-tab="change">Wat veranderde</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="page active" id="p-overview"></section>
  <section class="page" id="p-ig"></section>
  <section class="page" id="p-tt"></section>
  <section class="page" id="p-yt"></section>
  <section class="page" id="p-trend"></section>
  <section class="page" id="p-bank"></section>
  <section class="page" id="p-plan"></section>
  <section class="page" id="p-change"></section>
</main>

<dialog id="modal"><form method="dialog" id="mform"></form></dialog>
<input type="file" id="fileIn" accept=".csv,.json,text/csv,application/json" hidden>
<div class="toast" id="toast"></div>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('nl-NL');
function fmt(n){ n=+n||0; if(n>=1e6) return (n/1e6).toFixed(1).replace('.',',')+'M'; if(n>=1e4) return Math.round(n/1e3)+'K'; return nf.format(Math.round(n)); }
function pct(x,d=1){ return (x*100).toFixed(d).replace('.',',')+'%'; }
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const avg=(a,f)=>a.length?sum(a,f)/a.length:0;
const eng=p=>(+p.likes||0)+(+p.comments||0)+(+p.saves||0)+(+p.shares||0);
const parseD=s=>new Date(s+'T12:00:00');
const dayName=s=>DAYS[(parseD(s).getDay()+6)%7];
function dateNL(s){ try{return parseD(s).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}catch(e){return s} }
function refDate(){ const ds=S.posts.map(p=>p.date).filter(Boolean).sort(); return ds.length?parseD(ds[ds.length-1]):new Date(); }
function within(p,from,to){ const d=parseD(p.date); return d>from && d<=to; }
function tone(score){ return score>=70?'good':score>=40?'warn':'bad'; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
const pill=p=>`<span class="pill ${p}">${PL_SHORT[p]||'?'}</span>`;

/* ============================================================
   ANALYTICS
   ============================================================ */
function byCategory(posts){
  const m={};
  posts.forEach(p=>{ (m[p.category]=m[p.category]||[]).push(p); });
  const rows=Object.entries(m).map(([cat,ps])=>({cat,n:ps.length,avgViews:avg(ps,p=>p.views),er:sum(ps,eng)/Math.max(1,sum(ps,p=>p.views))}));
  const max=Math.max(1,...rows.map(r=>r.avgViews));
  rows.forEach(r=>r.score=Math.round(r.avgViews/max*100));
  return rows.sort((a,b)=>b.score-a.score);
}
// cross-platform: normalize each post against its own platform's average so TikTok's bigger numbers don't dominate
function crossCategory(){
  const pAvg={}; ['ig','tt','yt'].forEach(k=>pAvg[k]=avg(S.posts.filter(p=>p.platform===k),p=>p.views)||1);
  const m={};
  S.posts.forEach(p=>{ (m[p.category]=m[p.category]||[]).push(p.views/pAvg[p.platform]); });
  const rows=Object.entries(m).map(([cat,xs])=>({cat,n:xs.length,idx:xs.reduce((a,b)=>a+b,0)/xs.length}));
  const max=Math.max(0.01,...rows.map(r=>r.idx));
  rows.forEach(r=>r.score=Math.round(r.idx/max*100));
  return rows.sort((a,b)=>b.score-a.score);
}
function health(k){
  const ps=S.posts.filter(p=>p.platform===k);
  const V=Math.max(1,sum(ps,p=>p.views));
  const ref=refDate(), from=new Date(ref-28*864e5);
  const recent=ps.filter(p=>within(p,from,ref)).length;
  const shortPs=ps.filter(p=>+p.duration>0 && +p.duration<=30), longPs=ps.filter(p=>+p.duration>30);
  const rows=[
    {name:'Engagement rate',val:sum(ps,eng)/V,target:k==='ig'?0.12:0.10},
    {name:k==='yt'?'Likes per view':'Saves per view',val:k==='yt'?sum(ps,p=>p.likes)/V:sum(ps,p=>p.saves)/V,target:k==='yt'?0.06:0.05},
    {name:'Shares per view',val:sum(ps,p=>p.shares)/V,target:0.025},
    {name:'Comments per view',val:sum(ps,p=>p.comments)/V,target:0.008},
  ].map(r=>({...r,score:Math.min(100,Math.round(r.val/r.target*100)),sub:pct(r.val)}));
  rows.push({name:'Postfrequentie',sub:`${recent} posts / 4 wk`,score:Math.min(100,Math.round(recent/(S.weeklyTarget*4)*100))});
  if(shortPs.length&&longPs.length){
    const r=avg(shortPs,p=>p.views)/Math.max(1,avg(longPs,p=>p.views));
    rows.push({name:'Kort (≤30s) vs lang',sub:`${r.toFixed(1).replace('.',',')}× meer views`,score:Math.min(100,Math.round(r/3*100))});
  }
  return rows;
}
function insights(k){
  const ps=S.posts.filter(p=>p.platform===k);
  const good=[],bad=[];
  if(ps.length<3){ return {good:[{t:'Nog te weinig data',x:'Voeg minstens 3 posts toe om patronen te zien.'}],bad:[]}; }
  const A=avg(ps,p=>p.views);
  const cats=byCategory(ps).filter(c=>c.n>=1);
  const rel=v=>{const d=Math.round((v/A-1)*100); return (d>=0?'+':'')+d+'%';};
  if(cats.length){
    const b=cats[0]; good.push({t:`${b.cat} = sterkste onderwerp`,x:`Gemiddeld ${fmt(b.avgViews)} views (${rel(b.avgViews)} t.o.v. je gemiddelde) over ${b.n} post${b.n>1?'s':''}. Maak hier een vaste serie van.`});
    const w=cats[cats.length-1]; if(cats.length>1) bad.push({t:`${w.cat} blijft achter`,x:`Gemiddeld ${fmt(w.avgViews)} views (${rel(w.avgViews)}). Probeer een sterkere hook of verwerk het in een ander format.`});
  }
  const fm={}; ps.forEach(p=>(fm[p.format]=fm[p.format]||[]).push(p));
  const fr=Object.entries(fm).map(([f,a])=>({f,n:a.length,v:avg(a,p=>p.views),s:sum(a,p=>p.saves)/Math.max(1,sum(a,p=>p.views))})).sort((a,b)=>b.v-a.v);
  if(fr.length>1){ good.push({t:`${fr[0].f} presteert het best`,x:`${fmt(fr[0].v)} gem. views tegen ${fmt(fr[fr.length-1].v)} voor ${fr[fr.length-1].f}.`});
    const bs=[...fr].sort((a,b)=>b.s-a.s)[0]; if(bs.s>0&&bs.f!==fr[0].f) good.push({t:`${bs.f} wordt het vaakst bewaard`,x:`${pct(bs.s)} van de kijkers slaat dit format op — goed voor het algoritme.`}); }
  const sh=ps.filter(p=>+p.duration>0&&+p.duration<=30), lo=ps.filter(p=>+p.duration>30);
  if(sh.length&&lo.length){ const r=avg(sh,p=>p.views)/Math.max(1,avg(lo,p=>p.views));
    if(r>=1.2) good.push({t:'Korte video\'s (≤30s) winnen',x:`${r.toFixed(1).replace('.',',')}× meer views dan langere video's. Snelheid houdt kijkers vast.`});
    if(r>=1.2) bad.push({t:'Lange video\'s (30s+) haken af',x:`${lo.length} video's boven 30 seconden halen gemiddeld ${fmt(avg(lo,p=>p.views))} views. Knip ze op of start met de conclusie.`});
    else if(r<0.8) good.push({t:'Langere video\'s werken hier',x:`Video's boven 30s halen ${fmt(avg(lo,p=>p.views))} gem. views. Je publiek wil diepgang.`}); }
  const dm={}; ps.forEach(p=>(dm[dayName(p.date)]=dm[dayName(p.date)]||[]).push(p.views));
  const dr=Object.entries(dm).filter(([,a])=>a.length>=2).map(([d,a])=>({d,v:a.reduce((x,y)=>x+y,0)/a.length})).sort((a,b)=>b.v-a.v);
  if(dr.length>1) good.push({t:`${dr[0].d} is je beste postdag`,x:`${fmt(dr[0].v)} gem. views, tegen ${fmt(dr[dr.length-1].v)} op ${dr[dr.length-1].d.toLowerCase()}.`});
  const low=[...ps].sort((a,b)=>a.views-b.views)[0];
  if(low && low.views<A*0.5) bad.push({t:`Laagste post: "${low.title}"`,x:`${fmt(low.views)} views (${rel(low.views)}). ${low.category==='Achter de schermen'||low.category==='Routine'?'Persoonlijke content scoort lager zonder concrete belofte in de hook.':'Check of de eerste 2 seconden duidelijk genoeg waren.'}`});
  const ref=refDate(); const from=new Date(ref-28*864e5);
  const rec=ps.filter(p=>within(p,from,ref)).length;
  if(rec<S.weeklyTarget*4) bad.push({t:'Postfrequentie onder doel',x:`${rec} posts in de laatste 4 weken; doel is ${S.weeklyTarget*4}. Gebruik de weekplanner om vooruit te werken.`});
  return {good,bad};
}

   CSV / JSON
   ============================================================ */
function parseCSV(text){
  const sep=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===sep){row.push(cell);cell='';} else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cell);rows.push(row);row=[];cell=''; } else cell+=c; }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()));
}
const HEAD_MAP={platform:'platform',platform_:'platform',titel:'title',title:'title',hook:'title',onderwerp:'category',categorie:'category',category:'category',format:'format',type:'format',datum:'date',date:'date',views:'views',weergaven:'views',plays:'views',likes:'likes',comments:'comments',reacties:'comments',saves:'saves',opgeslagen:'saves',shares:'shares',gedeeld:'shares',duur:'duration',duration:'duration'};
function normPlat(v){ v=String(v).toLowerCase(); if(v.startsWith('t')) return 'tt'; if(v.startsWith('y')) return 'yt'; return 'ig'; }
function normDate(v){ v=String(v).trim(); let m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; m=v.match(/^\d{4}-\d{2}-\d{2}/); return m?m[0]:new Date().toISOString().slice(0,10); }
const numv=v=>+String(v).replace(/\./g,'').replace(',','.').replace(/[^\d.]/g,'')||0;
function importCSV(text,replace){
  const rows=parseCSV(text); if(rows.length<2) throw new Error('Leeg bestand');
  const heads=rows[0].map(h=>HEAD_MAP[h.trim().toLowerCase().replace(/\s+/g,'_')]||null);
  if(!heads.includes('views')||!heads.includes('title')) throw new Error('Kolommen "titel" en "views" zijn verplicht');
  const posts=rows.slice(1).map(r=>{const p={id:uid(),platform:'ig',title:'',category:CATS[0],format:'Reel',date:'',views:0,likes:0,comments:0,saves:0,shares:0,duration:0};
    heads.forEach((h,i)=>{ if(!h) return; const v=r[i]??''; if(h==='platform') p.platform=normPlat(v); else if(h==='date') p.date=normDate(v); else if(['views','likes','comments','saves','shares','duration'].includes(h)) p[h]=numv(v); else p[h]=v.trim()||p[h]; });
    if(!p.date) p.date=new Date().toISOString().slice(0,10); return p;}).filter(p=>p.title);
  S.posts=replace?posts:S.posts.concat(posts); S.sample=false; return posts.length;
}
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function toCSV(){ const h=['platform','datum','titel','onderwerp','format','views','likes','comments','saves','shares','duur']; const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  return [h.join(',')].concat(S.posts.map(p=>[PLAT[p.platform],p.date,p.title,p.category,p.format,p.views,p.likes,p.comments,p.saves,p.shares,p.duration].map(q).join(','))).join('\n'); }

    <div><b>Posts importeren uit CSV</b><p class="muted" style="font-size:12.5px;margin:4px 0 8px">Exporteer je posts uit Instagram/TikTok/YouTube (of Metricool, Later, enz.) naar een spreadsheet met kolommen: <span class="mono">platform, datum, titel, onderwerp, format, views, likes, comments, saves, shares, duur</span>. Alleen <i>titel</i> en <i>views</i> zijn verplicht.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" data-imp="replace">CSV importeren (vervangen)</button><button type="button" class="btn" data-imp="add">CSV toevoegen</button><button type="button" class="btn" id="tplCsv">Leeg sjabloon</button></div></div>
    <div><b>Back-up</b><p class="muted" style="font-size:12.5px;margin:4px 0 8px">Alles wordt in deze browser bewaard. Maak een back-up om op een ander apparaat verder te werken.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="expJson">Back-up downloaden (.json)</button><button type="button" class="btn" data-imp="json">Back-up terugzetten</button><button type="button" class="btn" id="expCsv">Posts als CSV</button></div></div>
    <div><b>Opnieuw beginnen</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button type="button" class="btn" id="clrPosts">Alle posts wissen</button><button type="button" class="btn" id="rstAll">Terug naar voorbeelddata</button></div></div>
  </div><div class="mf"><button class="btn" value="cancel">Sluiten</button></div>`;
  f.onsubmit=null;
  f.querySelectorAll('[data-imp]').forEach(btn=>btn.onclick=()=>{ importMode=btn.dataset.imp; $('#fileIn').value=''; $('#fileIn').click(); });
  $('#tplCsv').onclick=()=>download('skindecide-posts-sjabloon.csv','platform,datum,titel,onderwerp,format,views,likes,comments,saves,shares,duur\nInstagram,2026-02-02,Voorbeeld post,Ingrediënt spotlight,Reel,1000,80,5,40,10,25\n','text/csv');
  $('#expJson').onclick=()=>download('skindecide-dashboard-backup.json',JSON.stringify(S,null,2),'application/json');
  $('#expCsv').onclick=()=>download('skindecide-posts.csv',toCSV(),'text/csv');
  $('#clrPosts').onclick=()=>{ if(confirm('Alle posts wissen?')){ S.posts=[]; S.sample=false; save(); renderAll(); $('#modal').close(); toast('Posts gewist'); } };
  $('#rstAll').onclick=()=>{ if(confirm('Alles terugzetten naar voorbeelddata? Je eigen data gaat verloren.')){ const th=S.theme,ac=S.accent; S=defaults(); S.theme=th; S.accent=ac; save(); renderAll(); $('#modal').close(); toast('Voorbeelddata hersteld'); } };
  $('#modal').showModal();
}
$('#fileIn').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file) return;
  const text=await file.text();
  try{
    if(importMode==='json'){ const d=JSON.parse(text); if(!Array.isArray(d.posts)) throw new Error('Geen geldige back-up'); S=Object.assign(defaults(),d); toast('Back-up teruggezet'); }
    else { const n=importCSV(text,importMode==='replace'); toast(n+' posts geïmporteerd'); }
    save(); renderAll(); $('#modal').close();
  }catch(err){ alert('Import mislukt: '+err.message); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(S.theme==='auto') applyTheme(); });

load(); renderAll();
try{ const t=localStorage.getItem(KEY+'-tab'); if(t&&$('#p-'+t)) go(t); }catch(e){}
</script>
</body>
</html>
