<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamer's Turkse Taalkwartiertje</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#fdfbf7;min-height:100vh;color:#2c2c2c;line-height:1.6}
.container{max-width:1400px;margin:0 auto}
header{background:linear-gradient(135deg,#f8f6f3,#fff);padding:60px 40px;text-align:center;border-bottom:1px solid #e8e5df}
h1{color:#1a1a1a;font-size:2.8em;margin-bottom:8px;font-weight:300;letter-spacing:-0.5px}
.subtitle{color:#6b6b6b;font-size:.95em}
.progress-section{background:#fff;padding:30px 40px;border-bottom:1px solid #e8e5df}
.progress-info{display:flex;justify-content:space-between;margin-bottom:16px}
.progress-label{font-size:.85em;color:#6b6b6b;text-transform:uppercase;letter-spacing:1px;font-weight:500}
.progress-count{font-size:.9em;font-weight:500}
.progress-bar{background:#f5f3ef;height:6px;border-radius:10px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#c4b5a0,#a89885);height:100%;width:0%;transition:width .6s}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e8e5df;overflow-x:auto}
.tab{flex:1;min-width:100px;padding:20px 16px;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;font-size:.85em;font-weight:500;font-family:'Inter',sans-serif;color:#6b6b6b;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;transition:all .3s}
.tab:hover{color:#2c2c2c;background:#fafaf8}
.tab.active{color:#1a1a1a;border-bottom-color:#a89885;background:#fdfbf7}
.content{display:none;padding:50px 40px;animation:fadeIn .4s ease}
.content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toggle-row{display:flex;justify-content:center;margin-bottom:32px}
.toggle-group{display:flex;background:#f5f3ef;border-radius:50px;padding:4px;gap:0}
.tgl-btn{padding:10px 24px;border:none;background:transparent;color:#6b6b6b;border-radius:50px;cursor:pointer;font-weight:500;font-family:'Inter',sans-serif;font-size:.88em;transition:all .3s}
.tgl-btn.active{background:#fff;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.category-row{display:flex;gap:10px;margin-bottom:36px;flex-wrap:wrap;justify-content:center}
.cat-btn{padding:9px 20px;background:#fff;border:1px solid #e8e5df;border-radius:30px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.83em;color:#6b6b6b;font-weight:500;transition:all .3s}
.cat-btn:hover{border-color:#c4b5a0;color:#2c2c2c}
.cat-btn.active{background:#2c2c2c;color:#fff;border-color:#2c2c2c}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.word-card{background:#fff;padding:28px 20px;border-radius:12px;cursor:pointer;transition:all .3s;text-align:center;position:relative;border:1px solid #e8e5df;min-height:130px;display:flex;flex-direction:column;justify-content:center}
.word-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.08);border-color:#c4b5a0}
.word-card.flipped{background:#f5f3ef;border-color:#c4b5a0}
.word-card.flipped .wc-front{display:none}
.word-card .wc-back{display:none}
.word-card.flipped .wc-back{display:block}
.word-text{font-size:1.25em;font-weight:400;margin-bottom:6px;color:#1a1a1a}
.word-hint{font-size:.88em;color:#6b6b6b}
.play-btn{position:absolute;top:10px;right:10px;background:#f5f3ef;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:.95em;display:flex;align-items:center;justify-content:center;transition:all .3s}
.play-btn:hover{background:#e8e5df;transform:scale(1.1)}
.sentence-list{display:flex;flex-direction:column;gap:14px;max-width:860px;margin:0 auto}
.sent-card{background:#fff;padding:22px 26px;border-radius:12px;border:1px solid #e8e5df;transition:all .3s}
.sent-card:hover{border-color:#c4b5a0;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.sent-main{font-size:1.05em;color:#1a1a1a;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.sent-trans{color:#6b6b6b;font-size:.93em}
.story-wrap{max-width:780px;margin:0 auto}
.story-sel{width:100%;padding:10px 14px;border:1px solid #e8e5df;border-radius:8px;font-family:'Inter',sans-serif;font-size:.88em;background:#fff;margin-bottom:28px;cursor:pointer}
.story-box{background:#fff;padding:46px;border-radius:16px;border:1px solid #e8e5df}
.story-title{font-size:1.8em;color:#1a1a1a;margin-bottom:26px;text-align:center;font-weight:400}
.story-body{font-size:1.1em;color:#2c2c2c;line-height:2.1}
.cw{color:#a89885;font-weight:500;cursor:pointer;border-bottom:1px dotted #c4b5a0;transition:all .2s}
.cw:hover{color:#8a7865;border-bottom-style:solid}
.tooltip{position:fixed;background:#1a1a1a;color:#fff;padding:10px 14px;border-radius:8px;font-size:.88em;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none;max-width:220px}
.story-nav{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.story-nav button,.nav-btn{padding:10px 22px;background:#fff;border:1px solid #e8e5df;border-radius:30px;cursor:pointer;font-size:.83em;font-weight:500;font-family:'Inter',sans-serif;transition:all .3s}
.story-nav button:hover,.nav-btn:hover{border-color:#c4b5a0;background:#fafaf8}
.quiz-wrap{max-width:680px;margin:0 auto}
.quiz-q{font-size:1.55em;color:#1a1a1a;margin-bottom:32px;text-align:center;font-weight:400}
.quiz-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.quiz-opt{padding:18px;background:#fff;border:1px solid #e8e5df;border-radius:12px;cursor:pointer;text-align:center;transition:all .3s;font-size:1em;font-family:'Inter',sans-serif}
.quiz-opt:hover{border-color:#c4b5a0;background:#fafaf8;transform:translateY(-2px)}
.quiz-opt.correct{border-color:#7a9b76;background:#f0f5ef;color:#4a5f47}
.quiz-opt.incorrect{border-color:#b88a7a;background:#faf5f3;color:#6b4a3f}
.type-area{display:flex;flex-direction:column;align-items:center;gap:14px}
.type-input{width:100%;max-width:380px;padding:14px 18px;font-size:1.05em;border:2px solid #e8e5df;border-radius:12px;font-family:'Inter',sans-serif;outline:none;transition:border-color .3s;text-align:center}
.type-input:focus{border-color:#a89885}
.type-input.correct{border-color:#7a9b76;background:#f0f5ef;color:#4a5f47}
.type-input.incorrect{border-color:#b88a7a;background:#faf5f3;color:#6b4a3f}
.type-feedback{font-size:.95em;color:#6b6b6b;min-height:22px;text-align:center}
.score-disp{text-align:center;font-size:1.2em;margin-top:26px;font-weight:400}
.btn-primary{display:inline-block;padding:13px 30px;background:#2c2c2c;color:#fff;border:none;border-radius:30px;cursor:pointer;font-size:.88em;font-weight:500;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.5px;transition:all .3s;margin-top:18px}
.btn-primary:hover{background:#1a1a1a;transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.15)}
.audio-btn{background:none;border:none;cursor:pointer;font-size:1.15em;padding:5px;transition:transform .2s;opacity:.6}
.audio-btn:hover{transform:scale(1.15);opacity:1}
.pagination{display:flex;gap:6px;justify-content:center;margin-top:36px;flex-wrap:wrap}
.pg-btn{padding:7px 13px;background:#fff;border:1px solid #e8e5df;border-radius:8px;cursor:pointer;font-size:.83em;font-weight:500;font-family:'Inter',sans-serif;min-width:38px;transition:all .3s}
.pg-btn:hover{border-color:#c4b5a0;background:#fafaf8}
.pg-btn.active{background:#2c2c2c;color:#fff;border-color:#2c2c2c}
.pg-dots{padding:7px 4px;font-size:.83em;color:#6b6b6b}
@media(max-width:768px){
  header{padding:40px 20px}
  h1{font-size:2em}
  .content{padding:28px 16px}
  .word-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .story-box{padding:24px 16px}
  .tab{font-size:.72em;padding:14px 10px}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Tamer's Turkse Taalkwartiertje</h1>
    <p class="subtitle">Een elegante weg naar vloeiend Turks</p>
  </header>

  <div class="progress-section">
    <div class="progress-info">
      <span class="progress-label">Voortgang</span>
      <span class="progress-count"><span id="learnedCount">0</span> / <span id="totalCount">0</span> woorden</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('words',this)">Woorden</button>
    <button class="tab" onclick="switchTab('sentences',this)">Zinnen</button>
    <button class="tab" onclick="switchTab('stories',this)">Verhalen</button>
    <button class="tab" onclick="switchTab('quiz',this)">Quiz</button>
  </div>

  <!-- WOORDEN -->
  <div id="words" class="content active">
    <div class="toggle-row">
      <div class="toggle-group">
        <button class="tgl-btn active" id="wLangTR" onclick="setWordLang('tr-nl')">Turks → Nederlands</button>
        <button class="tgl-btn" id="wLangNL" onclick="setWordLang('nl-tr')">Nederlands → Turks</button>
      </div>
    </div>
    <div class="category-row" id="catRow"></div>
    <div class="word-grid" id="wordGrid"></div>
    <div class="pagination" id="wordPag"></div>
  </div>

  <!-- ZINNEN -->
  <div id="sentences" class="content">
    <div class="toggle-row">
      <div class="toggle-group">
        <button class="tgl-btn active" id="sLangTR" onclick="setSentLang('tr-nl')">Turks → Nederlands</button>
        <button class="tgl-btn" id="sLangNL" onclick="setSentLang('nl-tr')">Nederlands → Turks</button>
      </div>
    </div>
    <div class="sentence-list" id="sentList"></div>
    <div class="pagination" id="sentPag"></div>
  </div>

  <!-- VERHALEN -->
  <div id="stories" class="content">
    <div class="story-wrap">
      <select class="story-sel" id="storySel" onchange="renderStory(parseInt(this.value))"></select>
      <div class="story-box" id="storyBox"></div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="content">
    <div class="quiz-wrap">
      <div class="toggle-row">
        <div class="toggle-group">
          <button class="tgl-btn active" id="modeClick" onclick="setMode('click')">Klikken</button>
          <button class="tgl-btn" id="modeType" onclick="setMode('type')">Typen</button>
        </div>
      </div>
      <div class="quiz-q" id="quizQ"></div>
      <div id="quizBody"></div>
      <div class="score-disp" id="scoreDisp"></div>
      <div style="text-align:center">
        <button class="btn-primary" id="nextBtn" onclick="nextQ()" style="display:none">Volgende vraag →</button>
      </div>
    </div>
  </div>
</div>

  bodyFn:(n)=>`{İstanbul'a|Naar Istanbul} {ilk kez|voor de eerste keer} {geldim|kwam ik}. {Boğaz|De Bosporus} {görünce|bij het zien} {heyecanlandım|was ik opgewonden}. ${n%3===0?'{Kapalıçarşı|De Grote Bazaar}':n%3===1?'{Topkapı Sarayı|Het Topkapi Paleis}':'{Ayasofya|De Hagia Sophia}'} {ziyaret ettim|bezocht ik}. {Sokaklarda|Op de straten} {simit|ringbrood} {satıcıları|verkopers} {vardı|waren er}. {Akşam|s Avonds} {Boğaz|Bosporus} {üzerinde|over} {tekne|boot} {turu|tour} {yaptım|maakte ik}. {İstanbul|Istanbul} {kalbimde|in mijn hart} {kalacak|zal blijven}!`
},

  titleFn:(n)=>`Verhaal ${n}: Sağlıklı Yaşam – Gezond Leven`,

},
{
  titleFn:(n)=>`Verhaal ${n}: Komşularla İlişkiler – Burenrelaties`,
  bodyFn:(n)=>`{Komşularımla|Met mijn buren} {iyi|goede} {ilişkiler|relaties} {kurarım|onderhoud ik}. ${n%2===0?'{Bayramlarda|Op feestdagen} {tatlı|snoep} {götürürüm|breng ik}.':'{Yardıma|Om hulp} {ihtiyaçları olduğunda|wanneer ze nodig hebben} {koşarım|ren ik ernaartoe}.'} {Kapı komşum|Mijn buurvrouw} {yaşlı|oud} {bir hanım|een mevrouw} {dir|}. {Pazardan|Van de markt} {alışveriş yaparken|boodschappen doen} {onun ihtiyaçlarını da|haar benodigdheden ook} {alırım|koop ik}. {Komşuluk|Burenrelaties} {güzel bir şey|iets moois} {bence|vind ik}.`
},
{
  titleFn:(n)=>`Verhaal ${n}: Tatil Planları – Vakantieplannen`,
  bodyFn:(n)=>`{Bu yıl|Dit jaar} {tatilimi|mijn vakantie} ${n%3===0?'{Kapadokya\'da|in Cappadocië}':n%3===1?'{Antalya\'da|in Antalya}':'{Ege\'de|aan de Egeïsche Zee}'} {geçireceğim|ga ik doorbrengen}. {Rezervasyon|Reservering} {yaptım|heb ik gemaakt}. ${n%2===0?'{Sıcak hava|Het warme weer} ve {güzel sahiller|mooie stranden} {bekliyorum|verwacht ik}.':'{Tarihi yerler|Historische plekken} {gezmek istiyorum|wil ik bezoeken}.'} {Valizimi|Mijn koffer} {hazırlamaya başladım|begon ik voor te bereiden}. {Tatil günlerini|De vakantiedagen} {sabırsızlıkla|ongeduldig} {bekliyorum|wacht ik op}!`

];

const stories=Array.from({length:500},(_,i)=>{
  const tpl=storyTemplates[i%storyTemplates.length];
  return {title:tpl.titleFn(i+1), text:tpl.bodyFn(i+1)};
});

// ─── STATE ────────────────────────────────────────────────────────────────────
let wLang='tr-nl', sLang='tr-nl', curCat='basis', curWPage=1, curSPage=1;
let learnedWords=new Set(), qScore=0, qTotal=0, curQ=null, qMode='click';
const PER_PAGE=30;

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function speak(text,lang){
  if(!text)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang||'tr-TR'; u.rate=0.8;
  window.speechSynthesis.speak(u);
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='quiz') genQ();
}

// ─── WORDS ────────────────────────────────────────────────────────────────────
function renderCats(){
  const labels={basis:'Basis',getallen:'Getallen',eten:'Eten',familie:'Familie',dagelijks:'Dagelijks',werkwoorden:'Werkwoorden',bijvoeglijk:'Bijvoeglijk'};
  document.getElementById('catRow').innerHTML=Object.keys(vocabulary).map(c=>
    `<button class="cat-btn${c===curCat?' active':''}" onclick="pickCat('${c}')">${labels[c]}</button>`
  ).join('');
}

function pickCat(c){curCat=c;curWPage=1;renderCats();renderWords();}
function setWordLang(l){
  wLang=l;
  document.getElementById('wLangTR').classList.toggle('active',l==='tr-nl');
  document.getElementById('wLangNL').classList.toggle('active',l==='nl-tr');
  renderWords();
}

function renderWords(){
  const words=vocabulary[curCat]||[];
  const start=(curWPage-1)*PER_PAGE;
  const page=words.slice(start,start+PER_PAGE);
  document.getElementById('wordGrid').innerHTML=page.map((w,i)=>{
    const front=wLang==='tr-nl'?w.tr:w.nl;
    const back=wLang==='tr-nl'?w.nl:w.tr;
    const idx=start+i;
    const safetr=esc(w.tr);
    return `<div class="word-card" id="wc${idx}" onclick="flipCard(${idx})">
      <button class="play-btn" onclick="event.stopPropagation();speak('${safetr}','tr-TR')">🔊</button>
      <div class="wc-front"><div class="word-text">${front}</div><div class="word-hint">Klik om te zien</div></div>
      <div class="wc-back"><div class="word-text">${back}</div><div class="word-hint">${front}</div></div>
    </div>`;
  }).join('');
  renderPag('wordPag',words.length,curWPage,p=>{curWPage=p;renderWords();});
  document.getElementById('totalCount').textContent=Object.values(vocabulary).flat().length;
}

function flipCard(idx){
  const card=document.getElementById('wc'+idx);
  card.classList.toggle('flipped');
  const words=vocabulary[curCat];
  if(words[idx]){
    const key=words[idx].tr+'|'+words[idx].nl;
    if(!learnedWords.has(key)){learnedWords.add(key);updProgress();}
  }
}

// ─── SENTENCES ────────────────────────────────────────────────────────────────
function setSentLang(l){
  sLang=l;
  document.getElementById('sLangTR').classList.toggle('active',l==='tr-nl');
  document.getElementById('sLangNL').classList.toggle('active',l==='nl-tr');
  renderSents();
}

function renderSents(){
  const start=(curSPage-1)*PER_PAGE;
  const page=sentences.slice(start,start+PER_PAGE);
  document.getElementById('sentList').innerHTML=page.map(s=>{
    const main=sLang==='tr-nl'?s.tr:s.nl;
    const trans=sLang==='tr-nl'?s.nl:s.tr;
    const lang=sLang==='tr-nl'?'tr-TR':'nl-NL';
    return `<div class="sent-card">
      <div class="sent-main">${main}<button class="audio-btn" onclick="speak('${esc(main)}','${lang}')">🔊</button></div>
      <div class="sent-trans">${trans}</div>
    </div>`;
  }).join('');
  renderPag('sentPag',sentences.length,curSPage,p=>{curSPage=p;renderSents();});
}

// ─── STORIES ─────────────────────────────────────────────────────────────────
function renderStorySel(){
  document.getElementById('storySel').innerHTML=stories.map((s,i)=>
    `<option value="${i}">${s.title}</option>`
  ).join('');
}

function renderStory(idx){
  idx=Math.max(0,Math.min(stories.length-1,idx));
  document.getElementById('storySel').value=idx;
  const story=stories[idx];
  const html=story.text.replace(/\{([^|{}]+)\|([^|{}]+)\}/g,(_,tr,nl)=>
    `<span class="cw" onclick="showTip(event,'${esc(tr)}','${esc(nl)}')">${tr}</span>`
  );
  document.getElementById('storyBox').innerHTML=`
    <h2 class="story-title">${story.title}</h2>
    <div class="story-body">${html}
      <button class="audio-btn" onclick="speakStory(${idx})" style="float:right;font-size:1.4em;margin-top:8px">🔊</button>
    </div>
    <div class="story-nav">
      ${idx>0?`<button onclick="renderStory(${idx-1})">← Vorige</button>`:''}
      <span style="padding:10px 8px;color:#6b6b6b;font-size:.85em">${idx+1} / ${stories.length}</span>
      ${idx<stories.length-1?`<button onclick="renderStory(${idx+1})">Volgende →</button>`:''}
    </div>`;
}

function speakStory(i){
  const clean=stories[i].text.replace(/\{([^|{}]+)\|[^|{}]+\}/g,'$1');
  speak(clean,'tr-TR');
}

let tipTimeout=null;
function showTip(e,tr,nl){
  e.stopPropagation();
  document.querySelectorAll('.tooltip').forEach(t=>t.remove());
  if(tipTimeout)clearTimeout(tipTimeout);
  const tip=document.createElement('div');
  tip.className='tooltip';
  tip.innerHTML=`<strong>${tr}</strong> = ${nl}<br><button class="audio-btn" onclick="event.stopPropagation();speak('${esc(tr)}','tr-TR')" style="color:#fff">🔊</button>`;
  document.body.appendChild(tip);
  const r=e.target.getBoundingClientRect();
  const left=Math.min(r.left, window.innerWidth-230);
  tip.style.cssText=`left:${left}px;top:${r.bottom+window.scrollY+6}px`;
  tipTimeout=setTimeout(()=>tip.remove(),4000);
  const rm=()=>{tip.remove();document.removeEventListener('click',rm);};
  document.addEventListener('click',rm);
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
function setMode(m){
  qMode=m;
  document.getElementById('modeClick').classList.toggle('active',m==='click');
  document.getElementById('modeType').classList.toggle('active',m==='type');
  genQ();
}

function genQ(){
  const all=Object.values(vocabulary).flat();
  curQ=all[Math.floor(Math.random()*all.length)];
  document.getElementById('quizQ').textContent=`Wat betekent "${curQ.tr}"?`;
  document.getElementById('nextBtn').style.display='none';

  if(qMode==='click'){
    const wrong=all.filter(w=>w.nl!==curQ.nl).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.nl);
    const opts=[...wrong,curQ.nl].sort(()=>Math.random()-.5);
    document.getElementById('quizBody').innerHTML=`<div class="quiz-opts">${
      opts.map(o=>`<button class="quiz-opt" onclick="checkClick('${esc(o)}')">${o}</button>`).join('')
    }</div>`;
  } else {
    document.getElementById('quizBody').innerHTML=`<div class="type-area">
      <input id="ti" class="type-input" type="text" placeholder="Typ de Nederlandse vertaling…"
        onkeydown="if(event.key==='Enter')checkType()">
      <div class="type-feedback" id="tf"></div>
      <button class="btn-primary" style="margin-top:8px" onclick="checkType()">Controleer</button>
    </div>`;
    setTimeout(()=>{const el=document.getElementById('ti');if(el)el.focus();},80);
  }
}

function checkClick(ans){
  qTotal++;
  document.querySelectorAll('.quiz-opt').forEach(o=>{
    o.disabled=true;
    if(o.textContent===curQ.nl) o.classList.add('correct');
    else if(o.textContent===ans) o.classList.add('incorrect');
  });
  if(ans===curQ.nl)qScore++;
  document.getElementById('scoreDisp').textContent=`Score: ${qScore} / ${qTotal}`;
  document.getElementById('nextBtn').style.display='';
}

function checkType(){
  const el=document.getElementById('ti');
  const fb=document.getElementById('tf');
  if(!el||!curQ)return;
  const ans=el.value.trim().toLowerCase();
  const cor=curQ.nl.toLowerCase();
  qTotal++;
  const ok=ans===cor||(ans.length>3&&cor.includes(ans));
  if(ok){qScore++;el.classList.add('correct');fb.style.color='#4a5f47';fb.innerHTML=`✓ Goed! <strong>${curQ.nl}</strong>`;}
  else{el.classList.add('incorrect');fb.style.color='#6b4a3f';fb.innerHTML=`✗ Fout. Antwoord: <strong>${curQ.nl}</strong>`;}
  el.disabled=true;
  document.getElementById('scoreDisp').textContent=`Score: ${qScore} / ${qTotal}`;
  document.getElementById('nextBtn').style.display='';
}

function nextQ(){genQ();}

// ─── PROGRESS ─────────────────────────────────────────────────────────────────
function updProgress(){
  const total=Object.values(vocabulary).flat().length;
  const pct=Math.round((learnedWords.size/total)*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('learnedCount').textContent=learnedWords.size;
}

// ─── PAGINATION ───────────────────────────────────────────────────────────────
function renderPag(id,total,cur,onChange){
  const el=document.getElementById(id);
  const pages=Math.ceil(total/PER_PAGE);
  if(pages<=1){el.innerHTML='';return;}
  const btns=[];
  const go=p=>`onclick="(${onChange})(${p})"`;
  if(cur>1) btns.push(`<button class="pg-btn" ${go(cur-1)}>‹</button>`);
  const MAX=7;
  let s=Math.max(1,cur-Math.floor(MAX/2));
  let e=Math.min(pages,s+MAX-1);
  if(e-s<MAX-1)s=Math.max(1,e-MAX+1);
  if(s>1){btns.push(`<button class="pg-btn" ${go(1)}>1</button>`);if(s>2)btns.push('<span class="pg-dots">…</span>');}
  for(let i=s;i<=e;i++) btns.push(`<button class="pg-btn${i===cur?' active':''}" ${go(i)}>${i}</button>`);
  if(e<pages){if(e<pages-1)btns.push('<span class="pg-dots">…</span>');btns.push(`<button class="pg-btn" ${go(pages)}>${pages}</button>`);}
  if(cur<pages) btns.push(`<button class="pg-btn" ${go(cur+1)}>›</button>`);
  el.innerHTML=btns.join('');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  renderCats();
  renderWords();
  renderSents();
  renderStorySel();
  renderStory(0);
  genQ();
  updProgress();
  document.getElementById('totalCount').textContent=Object.values(vocabulary).flat().length;
});
</script>
</body>
</html>
